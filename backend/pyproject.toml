[project]
name = "teamflow-backend"
version = "0.1.0"
description = "TeamFlow FastAPI backend (mini Kanban board)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.7",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = [
  "httpx>=0.27",
  "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
